name: CI

# 旧仓 CI 只跑 2 个 unittest，等于没有门禁。
# 新仓把「能机械检查的东西全部机械检查」：格式、lint、类型、依赖方向、
# 文档 frontmatter、冻结制品完整性、测试。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  python:
    name: Python 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-extras --dev

      - name: ruff format 检查
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy 类型检查
        run: uv run mypy

      - name: import-linter 依赖方向
        run: uv run lint-imports

      # integration 需要本地 PG / Parquet，不在 CI 跑。
      # golden 口径对拍包含在这一步里，P3 起才会有用例。
      - name: 测试
        run: uv run pytest -m "not integration and not slow" --cov

  guardrails:
    name: 仓库约束
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止 scripts/ 目录
        run: test ! -d scripts

      - name: 禁止凭据入库
        run: |
          if git ls-files | grep -E '(^|/)(config\.ini|\.env)$'; then
            echo "凭据文件不得入库"; exit 1
          fi

      # 一般文件 512KB 上限。frozen/ 单独放宽到 4MB：冻结制品不可重算，
      # 体积由制品本身决定（旧仓 bond_timing 的 nav.csv 就有 1MB）。
      - name: 禁止超大文件入库
        run: |
          large=$(git ls-files | while read -r f; do
            [ -f "$f" ] || continue
            case "$f" in frozen/*) limit=4194304 ;; *) limit=524288 ;; esac
            [ "$(wc -c <"$f")" -gt "$limit" ] && echo "$f"
          done)
          if [ -n "$large" ]; then
            echo "以下文件超过体积上限："; echo "$large"; exit 1
          fi

  web:
    name: 前端检查
    runs-on: ubuntu-latest
    # apps/web 在 P5 阶段落地，此前跳过
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
