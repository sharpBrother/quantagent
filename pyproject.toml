[project]
name = "quantagent"
version = "0.1.0"
description = "AI 量化投研系统：PostgreSQL 源镜像 + Parquet Lakehouse + DuckDB 查询 + Dagster 资产化编排"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# 运行时依赖。锁版由 uv.lock 负责，这里只约束兼容区间。
# 旧仓的教训：依赖不锁版、且 matplotlib/scipy/pytest/selenium 实际 import
# 但从未声明。新仓要求任何 import 的包必须出现在某个依赖组里。
dependencies = [
  # 数据与计算
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=17,<21",
  "duckdb>=1.1,<2",
  # 数据库：psycopg3 纯 Python 模式，不再需要 ODBC/JDBC，也不再需要 JVM
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  # 契约与配置
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pandera>=0.20,<0.24",
  "pyyaml>=6,<7",
  # CLI
  "typer>=0.12,<0.16",
  "rich>=13,<15",
  # 统计与优化（旧仓现役方法：WLS/OLS 中性化、scipy 风险平价）
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
# 编排。单独成组，便于只跑计算不起 Dagster 的场景。
orchestration = [
  "dagster>=1.8,<2",
  "dagster-webserver>=1.8,<2",
  "dagster-postgres>=0.24,<1",
]
# 机器学习。models/estimators/ml 的依赖，线性模型不需要它。
# 分组的意义：让「只有线性模型」和「引入 ML」在依赖层面也是显式切换。
ml = [
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
]
# 外部数据源客户端
sources = [
  "tushare>=1.4,<2",
  "requests>=2.32,<3",
  "pymssql>=2.3,<3",
]
# 绘图。旧仓 35+ 文件 import matplotlib 却从未声明，在此显式化。
viz = [
  "matplotlib>=3.9,<4",
]

[dependency-groups]
# uv 的开发依赖组，不随 wheel 分发
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "pre-commit>=4,<5",
  "jupytext>=1.16,<2",
  "types-pyyaml",
  "pandas-stubs",
]

[project.scripts]
quantagent = "quantagent.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantagent"]

# hatchling 默认只打包 .py。契约 YAML 必须进 wheel，否则安装后 check contracts 会空跑。
[tool.hatch.build.targets.wheel.force-include]
"src/quantagent/py.typed" = "quantagent/py.typed"
"src/quantagent/contracts/schemas" = "quantagent/contracts/schemas"
"src/quantagent/contracts/visibility" = "quantagent/contracts/visibility"


# ---------------------------------------------------------------------------
# ruff：lint + format 单一工具，取代旧仓缺失的 black/isort/flake8 组合
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "orchestration"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade：强制使用 3.12 惯用写法
  "B",           # flake8-bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "TID",         # 相对 import 管控
  "PTH",         # 强制 pathlib，杜绝旧仓 88 个文件写死绝对路径那类问题
  "RUF",
  "ANN",         # 强制类型注解
  "TC",          # 类型检查块
  "PD",          # pandas-vet
  "NPY",         # numpy
  "ARG",         # 未使用参数
  "PL",          # pylint 子集
]
ignore = [
  "ANN401",      # 允许 Any，适配器边界上有时必要
  "PLR0913",     # 参数个数：量化函数参数天然多
  "E501",        # 行长由 formatter 控制
  # 注释与文档字符串用中文，全角标点是正常内容而非歧义字符
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试可以用魔法数字与断言
"tests/**" = ["PLR2004", "ANN", "ARG"]
# notebook 是草稿，只保证语法正确
"notebooks/**" = ["ANN", "ARG", "E402", "PLR2004", "PD", "T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"


# ---------------------------------------------------------------------------
# mypy：严格模式。旧仓完全没有类型检查，新仓从第一天开始要求。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "orchestration", "tests"]

[[tool.mypy.overrides]]
# notebook 不做类型检查
module = "notebooks.*"
ignore_errors = true

[[tool.mypy.overrides]]
# 缺少 stub 的第三方库
module = ["duckdb.*", "pyarrow", "pyarrow.*", "statsmodels.*", "tushare.*", "lightgbm.*", "pandera.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: 零外部依赖，domain 规则必须落在这里",
  "contracts: 端口行为契约，三套适配器跑同一套",
  "golden: 与旧仓口径对拍，依赖 fixture 快照",
  "integration: 跨层链路，需要本地 PG 或 Parquet",
  "slow: 长耗时，默认 CI 跳过",
]

[tool.coverage.run]
source = ["src/quantagent"]
branch = true


# ---------------------------------------------------------------------------
# import-linter：只做反向引用与循环的机械防护。
# 它不能定义职责——职责定义在 docs/architecture/layers/ 与契约测试里。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["quantagent", "orchestration"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层方向单向，不得反向依赖"
type = "layers"
layers = [
  "orchestration",
  "quantagent.cli",
  "quantagent.publish",
  "quantagent.agents",
  "quantagent.portfolio",
  "quantagent.strategy",
  "quantagent.models",
  "quantagent.features",
  "quantagent.lake",
  "quantagent.ingest",
  "quantagent.adapters",
  "quantagent.domain",
  "quantagent.contracts",
  "quantagent.platform",
]

[[tool.importlinter.contracts]]
name = "domain 是纯规则层，禁止绑定任何存储实现"
type = "forbidden"
source_modules = ["quantagent.domain"]
forbidden_modules = [
  "quantagent.adapters",
  "quantagent.ingest",
  "quantagent.lake",
  "psycopg",
  "sqlalchemy",
  "duckdb",
  "pyarrow",
]

[[tool.importlinter.contracts]]
name = "contracts 不做 IO"
type = "forbidden"
source_modules = ["quantagent.contracts"]
forbidden_modules = ["psycopg", "sqlalchemy", "duckdb"]

[[tool.importlinter.contracts]]
name = "只有 ingest 与 adapters 可以接触 PostgreSQL 驱动"
type = "forbidden"
source_modules = [
  "quantagent.features",
  "quantagent.models",
  "quantagent.strategy",
  "quantagent.portfolio",
  "quantagent.agents",
  "quantagent.publish",
]
forbidden_modules = ["psycopg", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "业务层不得依赖 composition root"
type = "forbidden"
source_modules = [
  "quantagent.domain",
  "quantagent.features",
  "quantagent.models",
  "quantagent.strategy",
  "quantagent.portfolio",
  "quantagent.agents",
]
forbidden_modules = ["quantagent.cli", "orchestration"]
