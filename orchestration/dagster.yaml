# Dagster 实例配置。复制到 DAGSTER_HOME，不要把 DAGSTER_HOME 指到本目录。
# 本目录若被当成 DAGSTER_HOME，运行历史会写进仓库。
#
# 运行存储用 Dagster 默认的本地 SQLite（DAGSTER_HOME/history、schedules、storage），
# 不再连 PG 控制库 ops。执行机经 ToDesk 转发连 PG，daemon 的常驻线程各持一条空闲长连接，
# 会被转发吞掉而永久卡死。见 docs/adr/2026-11-17-dagster-local-run-storage.md。
# 只有采集步骤本身连 PG 研究库，串行、一次一条连接，并由子进程看门狗兜底。

# run 先进队列，由 daemon 启动，不挂在提交命令的进程下；同时最多跑一个。
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
telemetry:
  enabled: false
