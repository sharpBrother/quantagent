dataset: feature.metric
layer: lake
doc_ref: docs/architecture/derived-datasets.md#feature_metric
temporal_kind: point_event
event_field: event_dt
keys:
  - event_dt
  - feature_id
  - definition_version
  - param_hash
  - universe_id
  - horizon
  - metric_id
  - window
  - benchmark_id
reads:
  - feature.value
  - mart.forward_return
  - mart.universe_member
columns:
  event_dt:
    dtype: date
    nullable: false
    description: 指标对应的因子截面日，不是可见日
  feature_id:
    dtype: string
    nullable: false
    description: 被评价因子的语义身份
  definition_version:
    dtype: string
    nullable: false
    description: 被评价因子的计算逻辑版本
  param_hash:
    dtype: string
    nullable: false
    description: 被评价因子的参数指纹
  universe_id:
    dtype: string
    nullable: false
    description: 评价所用股票池
  horizon:
    dtype: string
    nullable: false
    description: 前瞻收益窗口
  metric_id:
    dtype: string
    nullable: false
    description: 指标身份，如 rank_ic / ic_mean / coverage；每日截面 IC 是一行
  window:
    dtype: string
    nullable: false
    description: 指标自身统计窗口；截面 IC 为 1d，滚动均值才是 20d 等
  benchmark_id:
    dtype: string
    nullable: false
    description: 涉及超额时的基准；否则为 none，不是填充
  value:
    dtype: float64
    nullable: false
    description: 指标值；缺失不落行
  knowledge_dt:
    dtype: date
    nullable: false
    description: max(因子 knowledge_dt, 对应 forward_return 的 knowledge_dt)
  pit_grade:
    dtype: string
    nullable: false
    description: 取因子与 forward_return 的更差值，拒绝手填
  computed_at:
    dtype: datetime
    nullable: false
    description: 计算时刻
  run_id:
    dtype: string
    nullable: false
    description: 运行身份
