dataset: signal.group_nav
layer: lake
doc_ref: docs/architecture/derived-datasets.md#group_nav
temporal_kind: point_event
event_field: event_dt
keys:
  - event_dt
  - feature_id
  - definition_version
  - param_hash
  - universe_id
  - horizon
  - group_no
  - run_id
reads:
  - feature.value
  - mart.universe_member
  - mart.forward_return
columns:
  event_dt:
    dtype: date
    nullable: false
    description: 净值日；含未来收益的分组净值其可见日仍看 knowledge_dt
  feature_id:
    dtype: string
    nullable: false
    description: 分组所用因子语义身份
  definition_version:
    dtype: string
    nullable: false
    description: 分组所用因子计算逻辑版本
  param_hash:
    dtype: string
    nullable: false
    description: 分组所用因子参数指纹
  universe_id:
    dtype: string
    nullable: false
    description: 股票池
  horizon:
    dtype: string
    nullable: false
    description: 调仓周期 / 收益窗口
  group_no:
    dtype: int64
    nullable: false
    description: 分组编号；多空组合为 -1，不是把缺失组填成 0
  group_return:
    dtype: float64
    nullable: false
    description: 当期分组收益；缺失不落行
  group_nav:
    dtype: float64
    nullable: false
    description: 分组累计净值
  knowledge_dt:
    dtype: date
    nullable: false
    description: 与 metric 相同，取因子与所用收益可见日的较晚者
  pit_grade:
    dtype: string
    nullable: false
    description: 输入木桶最差，拒绝手填抬升
  pit_report:
    dtype: string
    nullable: false
    description: pit_report JSON 文本；契约暂无 struct 类型
  run_id:
    dtype: string
    nullable: false
    description: 本次回测运行身份，计入键，避免两次运行撞行
  code_version:
    dtype: string
    nullable: false
    description: 代码版本
  config_digest:
    dtype: string
    nullable: false
    description: 配置 digest
