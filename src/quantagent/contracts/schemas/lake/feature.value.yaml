dataset: feature.value
layer: lake
doc_ref: docs/architecture/feature-storage.md
temporal_kind: point_event
event_field: event_dt
keys:
  - event_dt
  - asset_id
  - feature_id
  - definition_version
  - param_hash
reads:
  - mart.universe_member
columns:
  event_dt:
    dtype: date
    nullable: false
    description: 因子截面日，不是可见日
  asset_id:
    dtype: string
    nullable: false
    description: 资产身份，股票与 ETF 共表
  asset_class:
    dtype: string
    nullable: false
    description: 资产类别，如 stock / etf；共表字段，不是平行表
  feature_id:
    dtype: string
    nullable: false
    description: 因子语义身份，如 mom_20d
  definition_version:
    dtype: string
    nullable: false
    description: 计算逻辑版本
  param_hash:
    dtype: string
    nullable: false
    description: 参数配置指纹
  value:
    dtype: float64
    nullable: false
    description: 因子值；缺失不落行，不补 0 不补前值
  knowledge_dt:
    dtype: date
    nullable: false
    description: 由输入 knowledge_dt 的最大值加声明延迟自动推导，拒绝手填
  pit_grade:
    dtype: string
    nullable: false
    description: 沿输入木桶取最差，拒绝手填抬升
  computed_at:
    dtype: datetime
    nullable: false
    description: 计算时刻
  run_id:
    dtype: string
    nullable: false
    description: 写入本次计算的运行身份
