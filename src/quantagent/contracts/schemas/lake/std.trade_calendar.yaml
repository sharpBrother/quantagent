dataset: std.trade_calendar
layer: lake
doc_ref: docs/contracts/trade-calendar.md
temporal_kind: point_event
event_field: cal_dt
keys:
  - cal_dt
  - exchange
reads: []
columns:
  cal_dt:
    dtype: date
    nullable: false
    description: 日历日（业务日期，不是可见日）
  exchange:
    dtype: string
    nullable: false
    description: 交易所代码，与源端一致（SSE/SZSE/CFFEX 等），本层不做代码映射
  is_open:
    dtype: bool
    nullable: false
    description: 当日是否开市
  prev_trade_dt:
    dtype: date
    nullable: true
    description: 上一交易日；历史首日允许为空，禁止用哨兵日期填充
