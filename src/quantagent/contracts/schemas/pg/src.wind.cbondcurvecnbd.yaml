dataset: src.wind.cbondcurvecnbd
layer: pg
doc_ref: docs/migration/wind-pipeline-handoff.md
temporal_kind: point_event
keys:
  - OBJECT_ID
reads: []
event_field: TRADE_DT
columns:
  OBJECT_ID:
    dtype: string
    nullable: false
    description: 对象ID；子集镜像，范围见采集规格 source_filter：曲线 1232，期限 1,2,3,5,7,10,0.08,0.17,0.25,0.5
  TRADE_DT:
    dtype: string
    nullable: true
    description: 交易日期；交易日 YYYYMMDD，PIT 可见日依据
  B_ANAL_CURVENUMBER:
    dtype: int64
    nullable: true
    description: "曲线编号"
  B_ANAL_CURVENAME:
    dtype: string
    nullable: true
    description: "曲线名称"
  B_ANAL_CURVETYPE:
    dtype: string
    nullable: true
    description: "曲线类型"
  B_ANAL_CURVETERM:
    dtype: float64
    nullable: true
    description: "标准期限(年)"
  B_ANAL_YIELD:
    dtype: float64
    nullable: true
    description: "收益率(%)"
  B_ANAL_BASE_YIELD:
    dtype: float64
    nullable: true
    description: "估值日基础利率"
  B_ANAL_YIELD_TOTAL:
    dtype: float64
    nullable: true
    description: "收益率曲线数值"
  OPDATE:
    dtype: datetime
    nullable: true
    description: 更新时间；Wind 运维时间，用于采集游标
  OPMODE:
    dtype: string
    nullable: true
    description: 操作类型 0:新增 1:修改 2:删除
  gsUTime:
    dtype: datetime
    nullable: true
    description: "Wind 更新时间"
  gsCTime:
    dtype: datetime
    nullable: true
    description: "Wind 创建时间"
  mopdate:
    dtype: datetime
    nullable: true
    description: "Wind 维护时间"
