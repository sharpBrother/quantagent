dataset: src.wind.cbondpricesrepo
layer: pg
doc_ref: docs/migration/wind-pipeline-handoff.md
temporal_kind: point_event
keys:
  - OBJECT_ID
reads: []
event_field: TRADE_DT
columns:
  OBJECT_ID:
    dtype: string
    nullable: false
    description: 记录ID
  S_INFO_WINDCODE:
    dtype: string
    nullable: true
    description: "Wind代码"
  TRADE_DT:
    dtype: string
    nullable: true
    description: 交易日期；交易日 YYYYMMDD，PIT 可见日依据
  S_DQ_OPEN:
    dtype: float64
    nullable: true
    description: "开盘(%)"
  S_DQ_HIGH:
    dtype: float64
    nullable: true
    description: "最高(%)"
  S_DQ_LOW:
    dtype: float64
    nullable: true
    description: "最低(%)"
  S_DQ_CLOSE:
    dtype: float64
    nullable: true
    description: "收盘(%)"
  S_DQ_AVGPRICE:
    dtype: float64
    nullable: true
    description: "加权平均(%)"
  S_DQ_VOLUME:
    dtype: float64
    nullable: true
    description: "成交量(手)"
  S_DQ_AMOUNT:
    dtype: float64
    nullable: true
    description: "成交金额(千元)"
  OPDATE:
    dtype: datetime
    nullable: true
    description: 更新时间；Wind 运维时间，用于采集游标
  OPMODE:
    dtype: string
    nullable: true
    description: 操作类型 0:新增 1:修改 2:删除
  gsCTime:
    dtype: datetime
    nullable: true
    description: "Wind 创建时间"
  gsUTime:
    dtype: datetime
    nullable: true
    description: "Wind 更新时间"
  mopdate:
    dtype: datetime
    nullable: true
    description: "Wind 维护时间"
