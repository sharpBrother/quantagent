dataset: src.wind.cbondcurvecsi
layer: pg
doc_ref: docs/migration/wind-pipeline-handoff.md
temporal_kind: point_event
keys:
  - OBJECT_ID
reads: []
event_field: TRADE_DT
columns:
  OBJECT_ID:
    dtype: string
    nullable: false
    description: 对象ID；子集镜像，范围见采集规格 source_filter：曲线 0901、02502
  TRADE_DT:
    dtype: string
    nullable: true
    description: 交易日；PIT 可见日依据；源端措辞为“发布日期”，实为开市日
  B_ANAL_CURVENUMBER:
    dtype: string
    nullable: true
    description: "中证收益率曲线ID"
  B_ANAL_CURVENAME:
    dtype: string
    nullable: true
    description: "曲线名称"
  B_ANAL_CURVETYPE:
    dtype: string
    nullable: true
    description: "曲线类型"
  B_ANAL_CURVETERM:
    dtype: float64
    nullable: true
    description: "年限"
  B_ANAL_YIELD:
    dtype: float64
    nullable: true
    description: "收益率(%)"
  OPDATE:
    dtype: datetime
    nullable: true
    description: 更新时间；Wind 运维时间，用于采集游标
  OPMODE:
    dtype: string
    nullable: true
    description: 操作类型 0:新增 1:修改 2:删除
  gsUTime:
    dtype: datetime
    nullable: true
    description: "Wind 更新时间"
  mopdate:
    dtype: datetime
    nullable: true
    description: "Wind 维护时间"
  gsCTime:
    dtype: datetime
    nullable: true
    description: "Wind 创建时间"
