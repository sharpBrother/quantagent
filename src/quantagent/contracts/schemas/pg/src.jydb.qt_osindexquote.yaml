dataset: src.jydb.qt_osindexquote
layer: pg
doc_ref: docs/migration/jydb-ingest-plan.md
temporal_kind: point_event
event_field: TradingDay
keys:
  - ID
reads: []
columns:
  ID:
    dtype: int64
    nullable: false
    description: 聚源源表主键
  IndexCode:
    dtype: int64
    nullable: false
