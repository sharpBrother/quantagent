dataset: src.wind.ashareeodprices
layer: pg
doc_ref: docs/contracts/src-wind-ashareeodprices.md
temporal_kind: point_event
event_field: TRADE_DT
keys:
  - OBJECT_ID
reads: []
columns:
  OBJECT_ID:
    dtype: string
    nullable: false
    description: 对象ID
  S_INFO_WINDCODE:
    dtype: string
    nullable: true
    description: Wind代码
  TRADE_DT:
    dtype: string
    nullable: true
    description: 交易日期；PIT 事件日
  CRNCY_CODE:
    dtype: string
    nullable: true
    description: 货币代码
  S_DQ_PRECLOSE:
    dtype: float64
    nullable: true
    description: 昨收盘价(元)
  S_DQ_OPEN:
    dtype: float64
    nullable: true
    description: 开盘价(元)
  S_DQ_HIGH:
    dtype: float64
    nullable: true
    description: 最高价(元)
  S_DQ_LOW:
    dtype: float64
    nullable: true
    description: 最低价(元)
  S_DQ_CLOSE:
    dtype: float64
    nullable: true
    description: 收盘价(元)
  S_DQ_CHANGE:
    dtype: float64
    nullable: true
    description: 涨跌(元)
  S_DQ_PCTCHANGE:
    dtype: float64
    nullable: true
    description: 涨跌幅(%)
  S_DQ_VOLUME:
    dtype: float64
    nullable: true
    description: 成交量(手)
  S_DQ_AMOUNT:
    dtype: float64
    nullable: true
    description: 成交金额(千元)
  S_DQ_ADJPRECLOSE:
    dtype: float64
    nullable: true
    description: 复权昨收盘价(元)
  S_DQ_ADJOPEN:
    dtype: float64
    nullable: true
    description: 复权开盘价(元)
  S_DQ_ADJHIGH:
    dtype: float64
    nullable: true
    description: 复权最高价(元)
  S_DQ_ADJLOW:
    dtype: float64
    nullable: true
    description: 复权最低价(元)
  S_DQ_ADJCLOSE:
    dtype: float64
    nullable: true
    description: 复权收盘价（元，后复权）
  S_DQ_ADJFACTOR:
    dtype: float64
    nullable: true
    description: 复权因子
  S_DQ_AVGPRICE:
    dtype: float64
    nullable: true
    description: 均价(VWAP)
  S_DQ_TRADESTATUS:
    dtype: string
    nullable: true
    description: 交易状态；采集时 latin1→gbk 修复
  S_DQ_TRADESTATUSCODE:
    dtype: float64
    nullable: true
    description: 交易状态代码
  S_DQ_LIMIT:
    dtype: float64
    nullable: true
    description: 涨停价(元)
  S_DQ_STOPPING:
    dtype: float64
    nullable: true
    description: 跌停价(元)
  OPDATE:
    dtype: datetime
    nullable: true
    description: 更新时间；Wind 运维时间，采集游标用，不是 PIT 可见日
  OPMODE:
    dtype: string
    nullable: true
    description: 操作类型 0:新增 1:修改 2:删除
  S_DQ_ADJCLOSE_BACKWARD:
    dtype: float64
    nullable: true
    description: 前复权收盘价（元）。含观测日之后的除权信息，随每次除权重算整段历史；研究读取不得使用，复权请用 S_DQ_ADJCLOSE（后复权）或 S_DQ_ADJFACTOR。
  GSUPDTIME:
    dtype: bytes
    nullable: true
    description: >-
      SQL Server timestamp/rowversion，PG 存 bytea。当前 wind_db 源不提供该列
      （2026-11-14 公司端核对，全库 0 张表有 GSUPDTIME），故不进读取、写入与
      内容指纹；列保留以匹配已应用的 0003_wind.sql，写入时留 NULL。
      源端仍采集 gsUTime / gsCTime / mopdate 三个 datetime 元数据列。
  gsUTime:
    dtype: datetime
    nullable: true
    description: Wind 更新时间
  gsCTime:
    dtype: datetime
    nullable: true
    description: Wind 创建时间
  mopdate:
    dtype: datetime
    nullable: true
    description: Wind 维护时间
  _batch_id:
    dtype: int64
    nullable: false
    description: 采集批次，指向 src_wind._batch
  _ingested_at:
    dtype: datetime
    nullable: false
    description: 本系统采集时间，不是 PIT 依据
  _row_hash:
    dtype: string
    nullable: false
    description: 源端业务列的内容指纹
