dataset: src.jydb.c_ed_macroindicatordata
doc_ref: docs/migration/jydb-ingest-plan.md
temporal_kind: period_with_revision
period_fields:
  - IndicatorCode
  - EndDate
visibility:
  rule: source_field
  field: InfoPublDate
  date_only: true
  grade: A
  rationale: >
    聚源宏观指标以源端发布时刻 InfoPublDate 为准。该列是 timestamp，按日期比较，
    发布当天可见；空发布日不可见。见 docs/adr/2026-11-23-jydb-visibility.md。
pit_recoverable: true
