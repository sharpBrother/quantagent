dataset: mart.forward_return
doc_ref: docs/architecture/derived-datasets.md#forward_return
temporal_kind: point_event
event_field: event_dt
visibility:
  rule: source_field
  field: knowledge_dt
  grade: A
  rationale: >
    前瞻收益天然含未来信息。knowledge_dt 必须等于区间结束日 end_dt 的行情
    可见日，于是 knowledge_dt <= as_of 会挡掉尚未实现的收益。禁止用
    event_dt 或采集时间当作可见日。行情本身是市场收盘公开事实，故规则等级
    A；usage=evaluation_only，训练特征集读到即失败。
pit_recoverable: true
recomputable: true
