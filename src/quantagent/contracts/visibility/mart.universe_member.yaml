dataset: mart.universe_member
doc_ref: docs/architecture/derived-datasets.md#universe_member
temporal_kind: interval
visibility:
  rule: source_field
  field: knowledge_dt
  grade: B
  rationale: >
    成员关系的可见日写在 knowledge_dt 列，不得用 valid_from 代替。指数成分
    通常提前公告、延后生效，公告日与生效日必须分开；规则过滤池的可见日由
    过滤所依赖的输入推导。数据集级标 B：规则推导与公告日混用，行级
    pit_grade 仍按输入最差继承。读取只认 knowledge_dt。
pit_recoverable: true
recomputable: true
