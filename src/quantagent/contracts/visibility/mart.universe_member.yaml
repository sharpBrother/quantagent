dataset: mart.universe_member
doc_ref: docs/architecture/derived-datasets.md#universe_member
temporal_kind: interval
visibility:
  rule: source_field
  field: knowledge_dt
  grade: B
  rationale: >
    指数与行业成分延续旧仓：as_of 落在 [S_CON_INDATE, S_CON_OUTDATE]
    （OUTDATE 空则仍在池）即视为当时成员。源表无独立公告日，knowledge_dt
    等于 valid_from（INDATE）。成员查询还要满足区间命中，不能只滤
    knowledge_dt。规则过滤池的 knowledge_dt 由输入推导。数据集级标 B：
    生效区间不是公告日，行级 pit_grade 仍按输入最差继承。
pit_recoverable: true
recomputable: true
