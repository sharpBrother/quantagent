dataset: signal.group_nav
doc_ref: docs/architecture/derived-datasets.md#group_nav
temporal_kind: point_event
event_field: event_dt
visibility:
  rule: source_field
  field: knowledge_dt
  grade: B
  rationale: >
    因子分组净值经过权重到收益的执行语义，归 signal 层。当期收益依赖前瞻
    窗口，可见日与 feature.metric 相同：取因子与所用收益可见日的较晚者，
    存在 knowledge_dt。禁止用 event_dt 当可见日。多空组合占 group_no=-1，
    与普通分组共享 schema，以便和 rebalance 内核对照。
pit_recoverable: true
recomputable: true
